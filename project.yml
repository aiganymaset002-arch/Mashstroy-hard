# Запасной способ получить Xcode-проект, если .xcodeproj не открывается:
#   brew install xcodegen
#   xcodegen generate   (в корне репозитория)
# Приложение компилирует папку Packages/MashstroyKit/Sources напрямую (без локального пакета),
# supabase-swift подключается как обычный пакет из GitHub.
name: MashstroyAIControl
options:
  bundleIdPrefix: kz.mashstroy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  MashstroyAIControl:
    type: application
    platform: iOS
    sources:
      - path: App/MashstroyAIControl
      - path: Packages/MashstroyKit/Sources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.mashstroy.aicontrol
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/MashstroyAIControl/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MASHSTROY AI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 MASHSTROY"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
